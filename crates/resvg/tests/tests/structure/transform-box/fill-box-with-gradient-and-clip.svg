<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>fill-box transforms gradient and clip-path with the element</title>

    <defs>
        <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="0">
            <stop id="stop1" offset="0" stop-color="red"/>
            <stop id="stop2" offset="1" stop-color="blue"/>
        </linearGradient>
        <clipPath id="clip1">
            <circle id="circle1" cx="120" cy="100" r="30"/>
        </clipPath>
    </defs>
    <g id="g1" clip-path="url(#clip1)" transform="rotate(45)" transform-box="fill-box" transform-origin="center">
        <rect id="rect1" x="60" y="60" width="80" height="80" fill="url(#lg1)"/>
    </g>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
