<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>fill-box on a group</title>

    <g id="g1" transform="rotate(45)" transform-box="fill-box" transform-origin="center">
        <rect id="rect1" x="40" y="80" width="60" height="40" fill="green"/>
        <rect id="rect2" x="100" y="80" width="60" height="40" fill="blue"/>
    </g>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
