<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>fill-box on a text element</title>

    <text id="text1" x="50" y="110" font-size="30" fill="green"
          transform="rotate(45)" transform-box="fill-box" transform-origin="center">Text</text>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
