<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>border-box is an alias of stroke-box</title>

    <rect id="rect1" x="60" y="60" width="80" height="80" fill="green" stroke="red" stroke-width="10"
          transform="rotate(45)" transform-box="border-box" transform-origin="center"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
