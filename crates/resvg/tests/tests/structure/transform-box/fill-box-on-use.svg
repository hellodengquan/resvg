<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>fill-box on a use element</title>

    <defs>
        <rect id="rect1" x="0" y="0" width="80" height="60" fill="green"/>
    </defs>
    <use id="use1" xlink:href="#rect1" x="60" y="70"
         transform="rotate(45)" transform-box="fill-box" transform-origin="center"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
